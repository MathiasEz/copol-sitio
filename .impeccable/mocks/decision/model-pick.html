<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Folleto de la cooperativa</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1440px; height:900px; overflow:hidden; background:#F8EA39; color:#12261A; font-family:'Segoe UI',system-ui,sans-serif; }
  .tira { height:64px; background:#006633; color:#fff; display:flex; align-items:center; padding:0 40px; gap:36px; font-weight:800; font-size:18px; }
  .tira b { margin-left:auto; background:#fff; color:#006633; padding:10px 20px; border-radius:8px; }
  .tapa { display:grid; grid-template-columns:1.3fr 1fr; gap:24px; padding:32px 40px; height:836px; }
  .grande { background:#006633; border-radius:24px; color:#fff; padding:44px; position:relative; overflow:hidden; }
  .grande h1 { font-family:'Arial Narrow',sans-serif; font-weight:900; font-size:150px; line-height:.85; text-transform:uppercase; }
  .sello { position:absolute; right:36px; top:36px; width:190px; height:190px; border-radius:50%; background:#F8EA39; color:#006633; display:grid; place-items:center; text-align:center; font-weight:900; font-size:34px; transform:rotate(-10deg); }
  .grande p { position:absolute; left:44px; bottom:44px; font-size:24px; font-weight:700; }
  .col { display:grid; grid-template-rows:1fr 1fr 1fr; gap:24px; }
  .eti { background:#fff; border-radius:24px; border:4px solid #006633; padding:24px; display:flex; align-items:center; gap:24px; }
  .eti i { width:120px; height:120px; border-radius:16px; background:#cfe3d6; flex:none; }
  .eti strong { font-family:'Arial Narrow',sans-serif; font-weight:900; font-size:56px; line-height:.9; text-transform:uppercase; color:#006633; }
</style></head><body>
  <div class="tira"><span>COPOL</span><span>Beneficios</span><span>Bazar</span><span>Promociones</span><span>Locales</span><b>Hacete socio</b></div>
  <div class="tapa">
    <div class="grande"><h1>Comprá en cuotas aun en clearing</h1><div class="sello">15 cuotas<br>sin recargo</div><p>Bazar · Tienda · Supermercado</p></div>
    <div class="col">
      <div class="eti"><i></i><strong>Bazar</strong></div>
      <div class="eti"><i></i><strong>Pinecoop</strong></div>
      <div class="eti"><i></i><strong>Créditos</strong></div>
    </div>
  </div>
</body></html>
