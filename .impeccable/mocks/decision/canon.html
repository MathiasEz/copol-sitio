<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Estándar de la categoría</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1440px; height:900px; overflow:hidden; background:#fff; color:#12261A; font-family:'Segoe UI',system-ui,sans-serif; }
  .barra { height:80px; display:flex; align-items:center; padding:0 64px; gap:36px; border-bottom:1px solid #e3ebe6; font-weight:600; font-size:17px; }
  .barra b { margin-left:auto; background:#006633; color:#fff; padding:12px 22px; border-radius:10px; }
  .hero { margin:24px 64px; height:440px; border-radius:20px; background:linear-gradient(120deg,#006633,#008D36); color:#fff; padding:64px; }
  .hero h1 { font-size:64px; font-weight:800; max-width:640px; line-height:1.05; }
  .hero span { display:inline-block; margin-top:32px; background:#F8EA39; color:#12261A; padding:16px 28px; border-radius:10px; font-weight:800; font-size:20px; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:24px; margin:0 64px; }
  .card { height:240px; border:1px solid #e3ebe6; border-radius:16px; padding:28px; }
  .card i { display:block; width:48px; height:48px; border-radius:12px; background:#EAF4EE; margin-bottom:24px; }
  .card strong { font-size:24px; }
</style></head><body>
  <div class="barra"><span>COPOL</span><span>Sobre nosotros</span><span>Beneficios</span><span>Hipermercado</span><b>Hacete socio</b></div>
  <div class="hero"><h1>Bienes, servicios y soluciones para vos y tu familia</h1><span>Conocé los beneficios</span></div>
  <div class="cards"><div class="card"><i></i><strong>Créditos</strong></div><div class="card"><i></i><strong>Bazar</strong></div><div class="card"><i></i><strong>Servicios sociales</strong></div><div class="card"><i></i><strong>Locales</strong></div></div>
</body></html>
